# ================================
# Server
# ================================
server:
  port: 8080
  servlet:
    context-path: /health
    session:
      timeout: 30m
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: health

  # ================================
  # Redis (write buffer for watch data)
  # ================================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # ================================
  # DataSource (single physical database exposed through legacy routing keys)
  # ================================
  datasource:
    sources:
      old:
        type: com.alibaba.druid.pool.DruidDataSource
        driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
        url: jdbc:sqlserver://${DB_HOST_OLD:${DB_HOST:localhost}}:${DB_PORT_OLD:${DB_PORT:1433}};DatabaseName=${DB_NAME_OLD:${DB_NAME:health}};characterEncoding=UTF-8;encrypt=true;trustServerCertificate=true;socketTimeout=12000
        username: ${DB_USERNAME_OLD:${DB_USERNAME:sa}}
        password: ${DB_PASSWORD_OLD:${DB_PASSWORD:123abcd,}}
        initial-size: 10
        min-idle: 10
        max-active: 50
        max-wait: 8000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: true
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        filters: stat,wall,slf4j
        connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
        use-global-data-source-stat: true
      new:
        type: com.alibaba.druid.pool.DruidDataSource
        driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
        url: jdbc:sqlserver://${DB_HOST_OLD:${DB_HOST:localhost}}:${DB_PORT_OLD:${DB_PORT:1433}};DatabaseName=${DB_NAME_OLD:${DB_NAME:health}};characterEncoding=UTF-8;encrypt=true;trustServerCertificate=true;socketTimeout=12000
        username: ${DB_USERNAME_OLD:${DB_USERNAME:sa}}
        password: ${DB_PASSWORD_OLD:${DB_PASSWORD:123abcd,}}
        initial-size: 10
        min-idle: 10
        max-active: 50
        max-wait: 8000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: true
        test-on-return: false
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        filters: stat,wall,slf4j
        connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
        use-global-data-source-stat: true
    druid:
      # Druid monitor console: /health/druid
      stat-view-servlet:
        enabled: ${HEALTH_DRUID_ENABLED:false}
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:}
        login-password: ${DRUID_PASSWORD:}
        reset-enable: false
      web-stat-filter:
        enabled: ${HEALTH_DRUID_WEB_STAT_ENABLED:false}
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
        session-stat-enable: false

health:
  data-source:
    default-source: ${HEALTH_DEFAULT_SOURCE:old}
    request-default-source: ${HEALTH_REQUEST_SOURCE:old}
    watch-default-source: ${HEALTH_WATCH_SOURCE:old}
    simulator-source: ${HEALTH_SIMULATOR_SOURCE:old}
    request-header: X-Health-Data-Source
    request-cookie: Health-Data-Source
    allow-request-override: ${HEALTH_ALLOW_REQUEST_SOURCE_OVERRIDE:false}
    audit-request-override: ${HEALTH_AUDIT_REQUEST_SOURCE_OVERRIDE:true}
    request-override-paths:
      - ${HEALTH_REQUEST_SOURCE_OVERRIDE_PATH:/**}
    request-override-usernames:
      - ${HEALTH_REQUEST_SOURCE_OVERRIDE_USER:admin}
    simulator-imei-patterns:
      - ${HEALTH_SIMULATOR_IMEI_REGEX:^3594567800\d{5}$}
  security:
    cors:
      allowed-origin-patterns: ${HEALTH_CORS_ALLOWED_ORIGINS:http://localhost:9528,http://127.0.0.1:9528,http://localhost:9530,http://127.0.0.1:9530}
      allow-credentials: ${HEALTH_CORS_ALLOW_CREDENTIALS:true}
  observability:
    slow-query-threshold-ms: ${HEALTH_SLOW_QUERY_THRESHOLD_MS:500}
    slow-query-log-ms: ${HEALTH_SLOW_QUERY_LOG_MS:3000}
  realtime:
    online-window-minutes: ${HEALTH_REALTIME_ONLINE_WINDOW_MINUTES:15}
    freshness-minutes: ${HEALTH_REALTIME_FRESHNESS_MINUTES:5}
  command-center:
    pre-shift-review-minutes: ${HEALTH_PRE_SHIFT_REVIEW_MINUTES:30}
    device-data-interrupted-minutes: ${HEALTH_DEVICE_DATA_INTERRUPTED_MINUTES:15}
    device-low-battery-threshold: ${HEALTH_DEVICE_LOW_BATTERY_THRESHOLD:20}

# ================================
# MyBatis-Plus
# ================================
mybatis-plus:
  mapper-locations: mybatis/com/xzkj/**/mapp*/*Mapper.xml
  type-aliases-package: com.xzkj.**.model
  type-handlers-package: com.xzkj.health.config.mybatis
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    db-column-underline: true
    id-type: 0

# ================================
# Netty Server (device protocol)
# ================================
#
# TCP  (port 9000): all platforms, always enabled
# SCTP (port 9001): Linux only, enable on production via sctp.enabled=true
#
# Platform notes:
#   Linux  : load kernel module first: sudo modprobe sctp
#   Windows: SCTP not supported - keep sctp.enabled=false for local dev
#   macOS  : limited support, not recommended for production
#
# Both TCP and SCTP share the same business handlers and write to the same DB tables.
netty:
  # TCP server (primary protocol)
  server:
    enabled: true          # Windows/IDEA development - use TCP
    port: 9000             # watch devices connect here via TCP
    boss-threads: 1        # threads for accepting new connections
    worker-threads: 8      # threads for read/write (increased for 1000 watches)
    idle-timeout: 300      # read idle timeout in seconds - close connection if exceeded
    write-idle-timeout: 60 # write idle timeout in seconds - send heartbeat if exceeded

  # SCTP server (new - Linux production only)
  sctp:
    enabled: false        # Disabled for Windows development
    port: 9001             # watch devices connect here via SCTP
    boss-threads: 1
    worker-threads: 4
    idle-timeout: 300
    write-idle-timeout: 60

# ================================
# Actuator: /health/actuator/health
# ================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# ================================
# DeepSeek AI API
# ================================
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  api-key-file: ${DEEPSEEK_API_KEY_FILE:${user.home}/Desktop/deepseek-key.txt}
  api-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat
  timeout-seconds: 60

# ================================
# Logging
# ================================
logging:
  file:
    name: ${HEALTH_LOG_FILE:runtime/health-backend.log}
  level:
    com.xzkj.health: INFO
    io.netty: WARN
    org.springframework: INFO
    com.alibaba.druid: WARN
    druid.sql.Statement: WARN
    com.alibaba.druid.pool.DruidDataSource: WARN
    org.springframework.transaction.interceptor.TransactionInterceptor: WARN
    com.microsoft.sqlserver: WARN
    org.apache.ibatis: WARN
    com.baomidou.mybatisplus: WARN
    org.mybatis: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
